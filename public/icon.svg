<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 752 752" role="img" aria-label="Rakivinum RV">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f11" />
      <stop offset="100%" stop-color="#1a1a1e" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4e4a8" />
      <stop offset="100%" stop-color="#c9a227" />
    </linearGradient>
  </defs>
  <!-- Širi viewBox = veći „margin“ kad launcher iseče u krug -->
  <rect x="-120" y="-120" width="752" height="752" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#gold)" stroke-width="12" opacity="0.28" />
  <!-- Stroke oko slova: mnogi Android launcheri loše renderuju sam fill na <text> -->
  <text
    x="256"
    y="310"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
    font-size="132"
    font-weight="900"
    fill="url(#gold)"
    stroke="#0f0f11"
    stroke-width="10"
    paint-order="stroke fill"
    letter-spacing="-4"
  >RV</text>
</svg>
